name: Requests

# A Request is an issue the owner opens from the phone; this turns it into a pull request.
# The issue's text is untrusted: it only reaches the script through an environment variable.
on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: request-${{ github.event.issue.number }}

jobs:
  new-recipe:
    name: New Recipe from a Request
    # Only the owner (numeric user ID, also checked in scripts/handle-request.ts).
    if: github.event.issue.user.id == 230893 && github.event.sender.id == 230893
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: request
        name: Ask the model for the Recipe
        run: node scripts/handle-request.ts
        env:
          REQUEST_BODY: ${{ github.event.issue.body }}
          AUTHOR_ID: ${{ github.event.issue.user.id }}
          ACTOR_ID: ${{ github.event.sender.id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Comment the problem on the Request
        if: steps.request.outputs.outcome == 'failed'
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/request-comment.md"
        env:
          GH_TOKEN: ${{ github.token }}

      - id: app-token
        if: steps.request.outputs.outcome == 'pull-request'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.REQUESTS_APP_ID }}
          private-key: ${{ secrets.REQUESTS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Pushed and opened with the app's token so the normal pull_request CI runs and counts.
      - id: pull-request
        name: Open the pull request
        if: steps.request.outputs.outcome == 'pull-request'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RECIPE_FILE: ${{ steps.request.outputs.file }}
        run: |
          branch="request/$ISSUE_NUMBER"
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          title="Add recipe: $(cat "$RUNNER_TEMP/recipe-title.txt")"
          git switch -c "$branch"
          git add -- "$RECIPE_FILE"
          git commit -m "$title"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/$branch"
          url="$(gh pr create --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md")"
          gh pr comment "$url" --body-file "$RUNNER_TEMP/conversions-comment.md"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Link the pull request on the Request
        if: steps.pull-request.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Pull request aberto: $PR_URL"

      - name: Report an unexpected failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Algo deu errado ao processar o pedido, e nenhum pull request foi aberto. Detalhes: $RUN_URL"
